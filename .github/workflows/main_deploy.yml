name: 🚀 StudMatch Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: studmatch-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Fast Lint & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Fast Lint Check
        run: |
          pip install ruff
          ruff check . --ignore E501,B008 --exit-zero

      - name: Show deploy info
        run: |
          echo "📦 Deploying commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "💬 Message: ${{ github.event.head_commit.message }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 8m
          script_stop: true
          script: |
            set -e
            echo "📁 Переходим в папку проекта..."
            cd ~/apps/bot-univer
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            git remote set-url origin https://github.com/notanotherworld/StudMatch.git 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            NEW_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            bash ./deploy.sh "$PREV_COMMIT" "$NEW_COMMIT"

      - name: Notify Telegram (success)
        if: success()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            curl -s --connect-timeout 5 --max-time 10 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"⚡ Деплой завершён за секунды!\n\n📦 Коммит: ${SHA:0:7}\n👤 Автор: ${ACTOR}\"}"
          fi

      - name: Notify Telegram (failure)
        if: failure()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            curl -s --connect-timeout 5 --max-time 10 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"❌ Ошибка деплоя!\n\n📦 Коммит: ${SHA:0:7}\n👤 Автор: ${ACTOR}\n🔗 https://github.com/${REPO}/actions/runs/${RUN_ID}\"}"
          fi
