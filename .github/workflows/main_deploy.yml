name: 🚀 StudMatch Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: studmatch-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Run ruff linter
        run: |
          ruff check . --ignore E501,B008 --exit-zero

  deploy:
    name: 🚢 Deploy
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show deploy info
        run: |
          echo "📦 Deploying commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "💬 Message: ${{ github.event.head_commit.message }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e

            echo "📁 Переходим в папку проекта..."
            cd ~/apps/bot-univer

            echo "⬇️ Получаем последний код..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Пересобираем и перезапускаем контейнеры..."
            docker compose pull
            docker compose up -d --build --remove-orphans

            echo "🗄️ Применяем новые миграции БД..."
            docker compose exec -T web alembic upgrade head

            echo "🧹 Удаляем старые образы..."
            docker image prune -f

            echo "✅ Деплой завершён успешно!"

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.VPS_HOST }}:8000/admin/login || echo "000")
          echo "HTTP статус (port 8000): $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
            echo "✅ Сервис веба доступен и отвечает!"
          else
            echo "⚠️ Веб-панель вернула статус $STATUS"
          fi
        continue-on-error: true

      - name: Notify Telegram (success)
        if: success() && secrets.BOT_TOKEN != '' && secrets.ADMIN_TELEGRAM_ID != ''
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"✅ Деплой завершён!\n\n📦 Коммит: ${SHA:0:7}\n👤 Автор: ${ACTOR}\"}"

      - name: Notify Telegram (failure)
        if: failure() && secrets.BOT_TOKEN != '' && secrets.ADMIN_TELEGRAM_ID != ''
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"❌ Ошибка деплоя!\n\n📦 Коммит: ${SHA:0:7}\n👤 Автор: ${ACTOR}\n🔗 https://github.com/${REPO}/actions/runs/${RUN_ID}\"}"
