name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: Линтинг и базовые проверки
  # ────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Run ruff linter
        run: |
          ruff check . --ignore E501,B008 --exit-zero

  # ────────────────────────────────────────────────────────────
  # JOB 2: Деплой на VPS (только после lint)
  # ────────────────────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Показываем инфо о коммите в логах
      - name: Show deploy info
        run: |
          echo "📦 Deploying commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "💬 Message: ${{ github.event.head_commit.message }}"

      # Подключаемся к VPS по SSH и деплоим
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script_stop: true     # Остановить при ошибке любой команды
          script: |
            set -e

            echo "📁 Переходим в папку проекта..."
            cd ~/apps/bot-univer

            echo "⬇️ Получаем последний код..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Пересобираем и перезапускаем контейнеры..."
            docker compose pull          # Обновляем базовые образы
            docker compose up -d --build --remove-orphans

            echo "🗄️ Применяем новые миграции БД..."
            docker compose exec -T web alembic upgrade head

            echo "🧹 Удаляем старые образы..."
            docker image prune -f

            echo "✅ Деплой завершён успешно!"

      # Проверяем что сервис ответил
      - name: Health check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ secrets.VPS_HOST }}/admin/login || echo "000")
          echo "HTTP статус: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
            echo "✅ Сервис доступен!"
          else
            echo "⚠️ Сервис вернул статус $STATUS"
          fi
        continue-on-error: true   # Не падаем если нет SSL

      # Уведомление в Telegram об успешном деплое
      - name: Notify Telegram (success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.ADMIN_TELEGRAM_ID }}",
              "text": "✅ *Деплой завершён*\n\n📦 Коммит: `${{ github.sha }}`\n👤 Автор: ${{ github.actor }}\n💬 `${{ github.event.head_commit.message }}`",
              "parse_mode": "Markdown"
            }'

      # Уведомление в Telegram при ошибке
      - name: Notify Telegram (failure)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.ADMIN_TELEGRAM_ID }}",
              "text": "❌ *Деплой УПАЛ*\n\n📦 Коммит: `${{ github.sha }}`\n👤 Автор: ${{ github.actor }}\n🔗 [Смотреть логи](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "parse_mode": "Markdown"
            }'
