<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}СтудМэч HR{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #252840;
    --accent: #6366f1;
    --accent2: #818cf8;
    --success: #34d399;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #2a2d45;
    --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  .header {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:16px 32px; display:flex; align-items:center; justify-content:space-between;
  }
  .header-logo { font-size:18px; font-weight:700; color:var(--accent2); }
  .header-info { font-size:13px; color:var(--muted); }
  .header-info strong { color:var(--text); }

  .container { max-width:1100px; margin:0 auto; padding:32px; }

  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:24px; margin-bottom:16px;
  }
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 18px; border-radius:8px; font-size:14px; font-weight:500;
    cursor:pointer; border:none; text-decoration:none; transition:all .2s;
  }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-ghost { background:var(--surface2); color:var(--text); }
  .badge {
    display:inline-flex; align-items:center; padding:2px 10px;
    border-radius:20px; font-size:12px; font-weight:600;
  }
  .badge-new { background:#6366f122; color:var(--accent2); }
  .badge-viewed { background:#34d39922; color:var(--success); }

  /* Mobile Responsive */
  @media(max-width:768px) {
    .header { padding:14px 16px; flex-direction:column; gap:8px; align-items:flex-start; }
    .container { padding:16px; }
    .card { padding:16px; }
    div[style*="display:grid"], div[style*="display: grid"] {
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">🎓 СтудМэч HR</div>
  <div class="header-info">
    {% if employer %}
    👔 <strong>{{ employer.company_name }}</strong> · {{ employer.contact_name }}
    · <a href="/employer/logout" style="color:var(--muted);text-decoration:none;">Выйти</a>
    {% endif %}
  </div>
</header>

<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
