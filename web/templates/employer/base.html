<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}СтудМэч HR{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #252840;
    --accent: #6366f1;
    --accent2: #818cf8;
    --success: #34d399;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #2a2d45;
    --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  .header {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:16px 32px; display:flex; align-items:center; justify-content:space-between;
  }
  .header-logo { font-size:18px; font-weight:700; color:var(--accent2); }
  .header-info { font-size:13px; color:var(--muted); }
  .header-info strong { color:var(--text); }

  .container { max-width:1100px; margin:0 auto; padding:32px; }

  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:24px; margin-bottom:16px;
  }
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 18px; border-radius:8px; font-size:14px; font-weight:500;
    cursor:pointer; border:none; text-decoration:none; transition:all .2s;
  }
  .btn-sm { padding:5px 12px; font-size:12px; border-radius:6px; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent2); }
  .btn-ghost { background:var(--surface2); color:var(--text); }
  .btn-ghost:hover { background:#2f3454; }
  .btn-success { background:#059669; color:#fff; }
  .btn-success:hover { background:#10b981; }
  .btn-warning { background:#d97706; color:#fff; }
  .btn-warning:hover { background:#f59e0b; }
  .btn-danger { background:#dc2626; color:#fff; }
  .btn-danger:hover { background:#ef4444; }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--muted); }
  .btn-outline:hover { background:var(--surface2); color:var(--text); border-color:var(--accent2); }

  .badge {
    display:inline-flex; align-items:center; padding:3px 10px;
    border-radius:20px; font-size:12px; font-weight:600;
  }
  .badge-new { background:#6366f122; color:var(--accent2); border:1px solid rgba(99,102,241,0.3); }
  .badge-viewed { background:#34d39922; color:var(--success); border:1px solid rgba(52,211,153,0.3); }
  .badge-suitable { background:rgba(234,179,8,0.18); color:#facc15; border:1px solid rgba(234,179,8,0.35); }
  .badge-archived { background:rgba(148,163,184,0.15); color:#94a3b8; border:1px solid rgba(148,163,184,0.3); }

  .tab-nav {
    display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--border);
    padding-bottom:12px; flex-wrap:wrap;
  }
  .tab-btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 16px; border-radius:8px; text-decoration:none;
    font-size:14px; font-weight:600; color:var(--muted);
    background:var(--surface); border:1px solid var(--border);
    transition:all .2s;
  }
  .tab-btn:hover { background:var(--surface2); color:var(--text); }
  .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tab-badge {
    padding:2px 7px; border-radius:12px; font-size:11px;
    background:rgba(255,255,255,0.15); color:inherit;
  }

  .nav-link {
    color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500;
    padding: 6px 12px; border-radius: 6px; transition: all .2s;
  }
  .nav-link:hover { color: var(--text); background: var(--surface2); }
  .nav-link.active { color: #fff; background: var(--accent); }

  /* Mobile Responsive */
  @media(max-width:768px) {
    .header { padding:14px 16px; flex-direction:column; gap:12px; align-items:flex-start; }
    .header-nav { width: 100%; overflow-x: auto; padding-bottom: 4px; }
    .container { padding:16px; }
    .card { padding:16px; }
    .tab-nav { gap:6px; }
    .tab-btn { padding:6px 12px; font-size:13px; }
    div[style*="display:grid"], div[style*="display: grid"] {
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }
  }
</style>
</head>
<body>

<header class="header">
  <div style="display:flex;align-items:center;gap:24px;">
    <a href="/employer/dashboard" style="text-decoration:none;" class="header-logo">🎓 СтудМэч HR</a>
    
    {% if employer %}
    <nav class="header-nav" style="display:flex;align-items:center;gap:4px;">
      <a href="/employer/dashboard" class="nav-link {% if request.url.path == '/employer/dashboard' or request.url.path == '/employer/' %}active{% endif %}">
        📊 Дашборд
      </a>
      <a href="/employer/profiles" class="nav-link {% if '/employer/profiles' in request.url.path %}active{% endif %}">
        📋 База кандидатов
      </a>
      <a href="/employer/requests" class="nav-link {% if '/employer/requests' in request.url.path %}active{% endif %}">
        📩 Заявка на подбор
      </a>
      <a href="/employer/settings" class="nav-link {% if '/employer/settings' in request.url.path %}active{% endif %}">
        ⚙️ Настройки
      </a>
    </nav>
    {% endif %}
  </div>

  <div class="header-info" style="display:flex;align-items:center;gap:12px;">
    {% if employer %}
    <div style="text-align:right;">
      <div>👔 <strong>{{ employer.company_name }}</strong></div>
      <div style="font-size:12px;color:var(--muted);">{{ employer.contact_name }}</div>
    </div>
    <form method="POST" action="/employer/logout" style="margin:0;">
      <button type="submit" class="btn btn-ghost btn-sm" title="Выйти из кабинета">
        🚪 Выйти
      </button>
    </form>
    {% endif %}
  </div>
</header>

<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
