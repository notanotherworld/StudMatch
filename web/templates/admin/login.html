{% extends "admin/base.html" %}
{% block title %}Вход — СтудМэч Admin{% endblock %}

{% block content %}
<style>
  body { display:flex; align-items:center; justify-content:center; }
  .main { margin-left:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .login-box {
    width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:40px;
  }
  .login-logo { text-align:center; margin-bottom:32px; }
  .login-logo h1 { font-size:28px; color:var(--accent2); }
  .login-logo p { color:var(--muted); font-size:14px; margin-top:4px; }
</style>

<div class="login-box">
  <div class="login-logo">
    <div style="display:flex;justify-content:center;margin-bottom:16px;">
      <img src="/static/img/logo.jpg" alt="StudMatch Logo"
           style="width:72px;height:72px;border-radius:18px;box-shadow:0 8px 25px rgba(99,102,241,0.35);border:1px solid rgba(255,255,255,0.15);object-fit:cover;">
    </div>
    <h1 style="font-size:24px;font-weight:800;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
      СтудМэч Admin
    </h1>
    <p style="color:var(--muted);font-size:13px;margin-top:4px;">Панель управления платформой</p>
  </div>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/admin/login">
    <div class="form-group">
      <label>Логин</label>
      <input type="text" name="login" placeholder="admin" required autofocus>
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">
      Войти
    </button>
  </form>
</div>
{% endblock %}
