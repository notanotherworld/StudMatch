{% extends "admin/base.html" %}
{% block title %}Смена пароля — СтудМэч{% endblock %}

{% block content %}
<div class="page-header">
  <h1>🔑 Смена пароля администратора</h1>
  <p style="color:var(--muted);font-size:14px;margin-top:4px;">Логин учетной записи: <b style="color:var(--accent2);">{{ admin.login }}</b></p>
</div>

<div style="max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;">
  {% if error %}
    <div style="background:rgba(239,68,68,0.15);border:1px solid var(--danger);color:var(--danger);padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;">
      ⚠️ {{ error }}
    </div>
  {% endif %}

  {% if success %}
    <div style="background:rgba(16,185,129,0.15);border:1px solid var(--success);color:var(--success);padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;">
      ✅ {{ success }}
    </div>
  {% endif %}

  <form method="POST" action="/admin/change-password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div style="margin-bottom:16px;">
      <label style="display:block;margin-bottom:6px;font-size:14px;color:var(--muted);">Текущий пароль:</label>
      <input type="password" name="old_password" required
             style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;">
    </div>

    <div style="margin-bottom:16px;">
      <label style="display:block;margin-bottom:6px;font-size:14px;color:var(--muted);">Новый пароль (минимум 8 символов):</label>
      <input type="password" name="new_password" required minlength="8"
             style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;">
    </div>

    <div style="margin-bottom:24px;">
      <label style="display:block;margin-bottom:6px;font-size:14px;color:var(--muted);">Подтвердите новый пароль:</label>
      <input type="password" name="confirm_password" required minlength="8"
             style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;">
    </div>

    <div style="display:flex;gap:12px;align-items:center;">
      <button type="submit" style="background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;flex:1;">
        Сохранить новый пароль
      </button>
      <a href="/admin/dashboard" style="background:var(--surface2);color:var(--text);padding:10px 16px;border-radius:8px;text-decoration:none;font-size:14px;">
        Отмена
      </a>
    </div>
  </form>
</div>
{% endblock %}
