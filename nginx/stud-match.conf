# ==============================================================================
# Nginx Configuration for StudMatch (СтудМэч)
# Поддомены:
# - stud-match.ru, www.stud-match.ru, landing.stud-match.ru -> Официальный промо-лендинг
# - hr.stud-match.ru                                        -> Портал работодателей и HR
# - admin.stud-match.ru                                     -> Панель администраторов
# ==============================================================================

upstream studmatch_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Ограничение частоты запросов от ботов и сканеров
limit_req_zone $binary_remote_addr zone=studmatch_limit:10m rate=25r/s;
limit_req_status 429;

# ── 0. Сброс прямых запросов по IP и неизвестных хостов ───────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ── 1. Лендинг и основной сайт (stud-match.ru, www.stud-match.ru, landing.stud-match.ru) ──
server {
    listen 80;
    server_name stud-match.ru www.stud-match.ru landing.stud-match.ru;

    client_max_body_size 50M;

    # Моментальный сброс ботов и сканеров (PHP, WordPress, системные файлы)
    location ~* (\.php|wp-|wordpress|wlwmanifest|\.env|\.git|\.aws|\.docker|actuator|\.azure|\.gcloud|\.ssh|composer\.|package\.json|terraform|\.bak|\.sql|\.conf) {
        return 444;
    }

    location / {
        limit_req zone=studmatch_limit burst=50 nodelay;
        proxy_pass http://studmatch_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ── 2. Портал HR и работодателей (hr.stud-match.ru) ───────────────────────────
