# ==============================================================================
# Nginx Configuration for StudMatch (СтудМэч)
# Поддомены:
# - stud-match.ru & landing.stud-match.ru -> Официальный промо-лендинг
# - hr.stud-match.ru                     -> Портал работодателей и HR
# - admin.stud-match.ru                  -> Панель администраторов
# ==============================================================================

upstream studmatch_web {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── 1. Лендинг и основной сайт (stud-match.ru, landing.stud-match.ru) ──────────
server {
    listen 80;
    server_name stud-match.ru landing.stud-match.ru;

    client_max_body_size 50M;

    location / {
        proxy_pass http://studmatch_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ── 2. Портал HR и работодателей (hr.stud-match.ru) ───────────────────────────
server {
    listen 80;
    server_name hr.stud-match.ru;

    client_max_body_size 50M;

    location / {
        proxy_pass http://studmatch_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ── 3. Панель Администраторов (admin.stud-match.ru) ───────────────────────────
server {
    listen 80;
    server_name admin.stud-match.ru;

    client_max_body_size 50M;

    location / {
        proxy_pass http://studmatch_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
