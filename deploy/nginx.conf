# ==============================================================================
# Nginx Configuration for StudMatch (СтудМэч)
# Поддомены:
# - stud-match.ru, www.stud-match.ru, landing.stud-match.ru -> Основной сайт / Лендинг
# - hr.stud-match.ru                                        -> Кабинет HR и работодателей
# - admin.stud-match.ru                                     -> Панель администраторов
# ==============================================================================

upstream studmatch_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Ограничение частоты запросов от ботов и сканеров (защита от DoS и брутфорса)
limit_req_zone $binary_remote_addr zone=studmatch_limit:10m rate=25r/s;
limit_req_status 429;

# ── 1. HTTP Редирект на HTTPS для всех поддоменов (Порт 80) ──────────────────
server {
    listen 80;
    server_name stud-match.ru www.stud-match.ru landing.stud-match.ru hr.stud-match.ru admin.stud-match.ru;

    # Путь для проверки сертификатов Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS Защищенный Сервер (Порт 443) ────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name stud-match.ru www.stud-match.ru landing.stud-match.ru hr.stud-match.ru admin.stud-match.ru;

    ssl_certificate /etc/letsencrypt/live/stud-match.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stud-match.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Блокировка попыток чтения системных и конфигурационных файлов сканерами
    location ~* (^|/)(\.env|\.git|\.aws|\.docker|wp-|xmlrpc\.php|phpinfo|actuator|terraform|composer\.|package\.json|\.azure|\.gcloud|\.ssh) {
        return 404;
    }

    location / {
        limit_req zone=studmatch_limit burst=50 nodelay;

        proxy_pass http://studmatch_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
