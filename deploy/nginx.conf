# Nginx конфигурация для StudMatch (домен + SSL)
# Замените YOUR_DOMAIN на ваш домен (например, studmatch.ru или app.studmatch.ru)

server {
    listen 80;
    server_name stud-match.ru www.stud-match.ru;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Сервер
server {
    listen 443 ssl;
    http2 on;
    server_name stud-match.ru www.stud-match.ru;

    ssl_certificate /etc/letsencrypt/live/stud-match.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stud-match.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
