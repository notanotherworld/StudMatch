# Nginx конфигурация для StudMatch (домен + SSL)
# Замените YOUR_DOMAIN на ваш домен (например, studmatch.ru или app.studmatch.ru)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Редирект с HTTP на HTTPS (раскомментировать после получения SSL-сертификата)
    # return 301 https://$host$request_uri;

    # До выписки SSL-сертификата Let's Encrypt (Certbot challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличенный лимит размера загружаемых документов/фото (20MB)
        client_max_body_size 20M;
    }
}

